<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Robot Puzzle Shooter</title>
    <link rel="stylesheet" href="src/game.css" />
  </head>
  <body>
    <main class="shell">
      <header class="hud">
        <h1>Robot Puzzle Shooter</h1>
        <p id="status">WASD move · first click focuses · then click/space shoot</p>
        <p id="meter">
          <span id="wave">W1</span>
          · HP <span id="hp">5</span>
          · nodes <span id="loot">0/1</span>
          · <span id="kills">0</span> down
        </p>
      </header>
      <canvas id="view" width="960" height="540" tabindex="0" aria-label="Robot Puzzle Shooter arena"></canvas>
      <p class="hint">
        WASD to move. First click focuses; then click or space to shoot. Red drones hurt you. Blue
        squares are nodes — shoot them ON. Pick one upgrade. Survive 3 waves. R retries.
      </p>
    </main>
    <script type="module" src="src/game.js"></script>
  </body>
</html>
